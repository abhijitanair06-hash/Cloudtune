name: CloudTune backend tests

on:
  pull_request:
    branches: [main, feature/moment-search-taste-lab]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - feature/moment-search-taste-lab
      - feat/device-playback-handoff
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    # Import-time settings are required by the app. These placeholders are
    # test-only and are not valid service credentials.
    env:
      JWT_SECRET_KEY: "ci-only-cloudtune-test-secret-not-used-for-any-real-account-000000000000000000000000000000000000"
      SUPABASE_URL: "https://example.supabase.co"
      SUPABASE_KEY: "ci-only-placeholder-not-a-real-supabase-key"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
