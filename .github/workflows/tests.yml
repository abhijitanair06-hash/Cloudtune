name: CloudTune backend tests

on:
  push:
    branches:
      - main
      - feat/gapless-player-controls
      - fix/auth-session-hardening
  pull_request:
    branches:
      - main
      - feat/gapless-player-controls

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://cloudtune:cloudtune-ci-db-password@127.0.0.1:5432/cloudtune
      JWT_SECRET_KEY: cloudtune-ci-access-key-only-for-unit-tests-67890
      JWT_REFRESH_SECRET_KEY: cloudtune-ci-refresh-key-only-for-unit-tests-12345
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: cloudtune-ci-placeholder-key
      SUPABASE_BUCKET: music
      CORS_ORIGINS: http://127.0.0.1:5500,http://localhost:5500
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q Tests
